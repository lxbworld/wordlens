<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">WordLens: an English word with a Chinese gloss stuck to it</title>
  <desc>Source for icons/icon{16,32,48,128}.png. Regenerate with:
    for s in 16 32 48 128; do rsvg-convert -w $s -h $s icon.svg -o icon$s.png; done
    Text uses Helvetica (A) and PingFang SC (中); swap in any bold sans / CJK font elsewhere.</desc>
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7C7BFF"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="stamp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <text x="44" y="90" font-family="Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <rect x="68" y="68" width="52" height="52" rx="15" fill="#ffffff" opacity="0.9"/>
  <rect x="71" y="71" width="46" height="46" rx="13" fill="url(#stamp)"/>
  <text x="94" y="103" font-family="PingFang SC, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#422006" text-anchor="middle">中</text>
</svg>
