<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title id="title">WordLens: a speech bubble saying “A”, annotated by a Chinese sticker</title>
  <desc>Source for icon48.png and icon128.png. Small sizes (icon16/icon32) use the simplified
    icon-small.svg so the letter stays legible. Regenerate:
    rsvg-convert -w 128 -h 128 icon.svg -o icon128.png
    rsvg-convert -w 48 -h 48 icon.svg -o icon48.png
    rsvg-convert -w 32 -h 32 icon-small.svg -o icon32.png
    rsvg-convert -w 16 -h 16 icon-small.svg -o icon16.png
    Text uses Helvetica (A) and PingFang SC (中); swap in any bold sans / CJK font elsewhere.</desc>
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#7C7BFF"/><stop offset="1" stop-color="#4338CA"/></linearGradient>
    <linearGradient id="st" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE047"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <path d="M42 26H86a20 20 0 0 1 20 20v26a20 20 0 0 1-20 20H58L26 106l18-14H42a20 20 0 0 1-20-20V46a20 20 0 0 1 20-20z"
        fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="5" stroke-linejoin="round" opacity="0.95"/>
  <text x="62" y="77" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#fff" text-anchor="middle">A</text>
  <g transform="rotate(-8 99 97)">
    <path d="M72 95a16 16 0 0 1 16-16h18a11 11 0 0 1 11 11v14a14 14 0 0 1-14 14H86a14 14 0 0 1-14-14z" fill="#FBBF24"/>
    <path d="M75 95a13 13 0 0 1 13-13h16a9 9 0 0 1 9 9v13a11 11 0 0 1-11 11H86a11 11 0 0 1-11-11z" fill="url(#st)"/>
    <text x="96" y="102" font-family="PingFang SC, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#422006" text-anchor="middle">中</text>
  </g>
</svg>
